# GSP firmware BẬT (2026-09-01, Phase 2). Trước đó =0 — workaround cũ chép từ
# thời driver 5xx đầu, không còn đúng.
#
# Bằng chứng phải bật:
#   - RTX 3060 = GA106 (Ampere). Driver 580.x mặc định GSP=1 cho Turing+;
#     =0 là ép về đường code legacy ít được test.
#   - Với GSP=0 đo được: `GSP Firmware Version: N/A` VÀ
#     `Power Management Object: N/A` — mất sạch telemetry power.
#   - nvidia-open (nhánh 610) BẮT BUỘC có GSP, không bật thì không migrate được.
#   - initramfs vẫn đang chép 102MB firmware GSP (gsp_ga10x 72M + gsp_tu10x 30M)
#     dù =0 khiến nó không bao giờ được nạp.
#   - [[project_suspend_broken]] tự ghi đây là "top suspect" cho lỗi resume.
#
# Rollback: đổi về 0, `sudo mkinitcpio -P`, reboot.
options nvidia NVreg_EnableGpuFirmware=1
