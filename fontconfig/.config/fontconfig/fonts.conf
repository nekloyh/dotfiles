<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Graphite Vivid — bind font generic vào font hệ thống.

  Lý do: trước file này `fc-match monospace` trả về Noto Sans Mono, KHÔNG có một
  glyph Nerd Font nào (fc-list ':charset=e0b6' | grep -c -i noto  ->  0). Mọi app
  hỏi font generic (Chromium fixed font, nhiều app GTK/TUI, Electron) vì thế hiện
  icon thành tofu, và font stack thực tế phình lên 5 họ thay vì 2.

  P3 (đẹp = nhất quán): đúng HAI họ — JetBrainsMono Nerd Font cho mono,
  Inter cho sans. Emoji fallback về Noto Color Emoji ở cả hai.

  Biến thể Nerd Font: "Mono" (icon ép về 1 ô) là bản đúng cho terminal/editor.
  "Propo" là bản proportional — icon rộng tự nhiên, sai cho lưới ký tự.
-->
<fontconfig>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Grayscale AA ở tầng fontconfig, khớp gsettings/gtk-3.0/xsettingsd.
       Panel 188 DPI: subpixel RGB không lợi mà gây viền màu + sai khi scale. -->
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>

</fontconfig>
