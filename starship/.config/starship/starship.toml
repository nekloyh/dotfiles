scan_timeout = 100
command_timeout = 500

"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
follow_symlinks = false

format = """
$character\
$directory\
$git_branch\
$git_state\
$git_status\
$env_var\
"""

right_format = "$all"

palette = "graphite_vivid"

[env_var.DOTFILES_DIRTY]
# Nhắc ~/Dotfiles còn thay đổi chưa commit/push (alacritty.toml từng nằm im 5
# tuần, lọt qua 5 commit sau đó). Dùng env_var chứ KHÔNG dùng [custom.*]:
# custom fork một shell MỖI LẦN vẽ prompt — đúng thứ đã bị xoá ở đợt rework
# starship 2026-07. Biến do hook precmd của zsh/fish đặt, throttle 300s:
# `git status` trên repo này ~2ms + `rev-list` ~1ms, chạy mỗi prompt sẽ gần gấp
# đôi độ trễ prompt (đang 4.3ms). Module tự ẩn khi biến rỗng / không set.
variable = "DOTFILES_DIRTY"
format = "[$env_value]($style) "
style = "bold fg:yellow"
description = "~/Dotfiles có thay đổi chưa commit/push"

[username]
disabled = false
show_always = false
style_user = "fg:peach"
style_root = "bold fg:red"
format = "[ $user ]($style) "

[directory]
style = "bold fg:sapphire"
format = "[$path ]($style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = "󰇚 "
"Music" = "󰝚 "
"Pictures" = "󰋩 "
"Developer" = "󰲋 "
"Others" = "󰉋 "

[line_break]
disabled = true

[character]
disabled = false
success_symbol = "[➜](bold fg:teal)"
error_symbol   = "[➜](bold fg:red)"
vimcmd_symbol             = "[➜](bold fg:yellow)"
vimcmd_replace_one_symbol = "[󰝿](bold fg:mauve)"
vimcmd_replace_symbol     = "[](bold fg:mauve)"
vimcmd_visual_symbol      = "[](bold fg:teal)"

[status]
disabled = false
style = "bold fg:maroon"
format = "[error](bold fg:red)[ $status]($style) "
pipestatus = true
pipestatus_format = "[$pipestatus]($style) "
pipestatus_separator = "[|]($style)"

[cmd_duration]
disabled = false
min_time = 100
show_milliseconds = false
style = "fg:peach"
format = "[take](bold fg:white)[ 󰔛 $duration ]($style)"

# Background jobs — coder hay & (build/server/watch); hiện số khi ≥1, zero-cost.
[jobs]
disabled = false
symbol = "󰜎 "
style = "bold fg:teal"
number_threshold = 1
format = "[ $symbol$number ]($style)"

[git_branch]
# Pill = cap trái + thân (bg) + cap phải. Cap là glyph Powerline U+E0B6/U+E0B4 tô
# fg = màu bg của pill → bo tròn 2 đầu. GIỮ NGUYÊN 2 glyph này: editor/pipe
# non-UTF8 hay nuốt PUA → mất cap, pill thành khối vuông (đã dính 1 lần).
style = "fg:lavender bg:violet900"
format = '[](fg:violet900)[ $branch(:$remote_branch) ]($style)[](fg:violet900) '

[git_state]
# Trailing space (không phải leading) — git_branch đã tự chừa 1 space phía sau.
style = "bold fg:peach"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
style = "fg:overlay2"
format = "([$modified$deleted$untracked$staged$renamed$conflicted$stashed$ahead_behind]($style))"
modified   = "[!${count} ](yellow)"
deleted    = "[-${count} ](red)"
untracked  = "[?${count} ](sky)"
staged     = "[+${count} ](green)"
renamed    = "[»${count} ](blue)"
conflicted = "[✖${count} ](red bold)"
stashed    = "[≡${count} ](lavender)"

ahead      = "[⇡${count} ](teal)"
behind     = "[⇣${count} ](peach)"
diverged   = "[⇕⇡${ahead_count}⇣${behind_count} ](mauve)"

[nodejs]
symbol = ""
style = "bold fg:green"
format = "[ $symbol( $version) ]($style)"

[c]
symbol = ""
style = "bold fg:sapphire"
format = "[ $symbol( $version) ]($style)"

[rust]
symbol = ""
style = "bold fg:peach"
format = "[ $symbol( $version) ]($style)"

[golang]
symbol = ""
style = "bold fg:teal"
format = "[ $symbol( $version) ]($style)"
detect_files = ["go.mod"]

[php]
symbol = ""
style = "bold fg:mauve"
format = "[ $symbol( $version) ]($style)"

[java]
symbol = ""
style = "bold fg:red"
format = "[ $symbol( $version) ]($style)"

[kotlin]
symbol = ""
style = "bold fg:peach"
format = "[ $symbol( $version) ]($style)"

[haskell]
symbol = ""
style = "bold fg:mauve"
format = "[ $symbol( $version) ]($style)"

[python]
symbol = ""
style = "bold fg:yellow"
format = "[ $symbol( $version)( \\($virtualenv\\)) ]($style)"

[lua]
symbol = "󰢱"
style = "bold fg:blue"
format = "[ $symbol( $version) ]($style)"

[docker_context]
symbol = ""
style = "bold fg:blue"
format = "[ $symbol( $context) ]($style)"

# Redundant với các module ngôn ngữ (đọc version từ Cargo.toml/package.json) — giữ tắt.
[package]
disabled = true

# Battery: mặc định ON và tốn ~65ms/prompt (nút cổ chai duy nhất) dù pin đầy không
# hiện gì. Trùng với pin waybar (đã có cảnh báo warning/critical + màu) → tắt cho
# prompt tức thời. Muốn hiện cảnh báo pin yếu trong prompt: đổi disabled = false.
[battery]
disabled = true

# ============================================================================
# PALETTES  —  đổi palette bằng dòng `palette = "..."` ở trên.
# Aliases đã căn đúng canonical graphite-vivid.css (sapphire=blue, sky=blue300,
# rosewater=magenta100) — hết drift so với phần còn lại của stack.
#
# NGOẠI LỆ CÓ CHỦ Ý: file này giữ TỪ VỰNG Catppuccin (peach/mauve/teal/lavender/
# sapphire/maroon/rosewater/flamingo/sky/pink) trong khi waybar/swaync/wlogout đã
# chuyển hết về tên canonical (orange/violet/cyan/violet300/blue/...). Lý do:
# palette starship là namespace RIÊNG của starship, và tên này bị 20+ module
# tham chiếu qua `style = "fg:peach"` — đổi tên là sửa 20+ chỗ để đổi lấy đúng
# 0 thay đổi hình ảnh. GIÁ TRỊ đã đúng canonical, chỉ NHÃN là khác.
# => Đừng "sửa cho nhất quán". Nếu đổi palette thì chạy render-mirrors.py.
# ============================================================================

[palettes.graphite_vivid]
# >>> gv-mirror — regen bằng `python3 ~/.config/colors/graphite-vivid/render-mirrors.py`; đừng sửa tay giữa 2 mốc
# --- background ---
crust    = "#070709"
mantle   = "#0c0d10"
base     = "#11131a"

surface0 = "#1a1c22"
surface1 = "#22252c"
surface2 = "#2c303a"
surface3 = "#3a3e4a"

overlay0 = "#676c72"
overlay1 = "#72777d"
overlay2 = "#7d8388"

# --- text ---
text         = "#c8ccd0"
text_bright  = "#e7e8ea"
subtext0     = "#969ca0"
subtext1     = "#b0b5b9"

# --- accents (graphite-vivid, rebalanced) ---
rosewater = "#ff95c6"
flamingo  = "#fa8dc1"
pink      = "#e36da7"
mauve     = "#8388e8"
red       = "#ea6b62"
maroon    = "#af2c2b"
peach     = "#e58130"
yellow    = "#e3b42c"
green     = "#99be42"
teal      = "#39c0b4"
sky       = "#76c5ff"
sapphire  = "#3aabf4"
blue      = "#3aabf4"
lavender  = "#a5a9ee"

# Pill / dark accent shades
violet950 = "#0e103a"   # git branch pill bg (dark violet-tinted)
violet900 = "#25285b"
# <<< gv-mirror
