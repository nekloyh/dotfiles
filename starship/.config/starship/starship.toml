scan_timeout = 100
command_timeout = 500

"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
follow_symlinks = false

format = """
$character\
$directory\
$git_branch\
$git_state\
$git_status\
"""

right_format = "$all"

palette = "graphite_vivid"

[username]
disabled = false
show_always = false
style_user = "fg:peach"
style_root = "bold fg:red"
format = "[ $user ]($style) "

[directory]
style = "bold fg:sapphire"
format = "[$path ]($style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Developer" = "󰲋 "
"Others" = " "

[line_break]
disabled = true

[character]
disabled = false
success_symbol = "[➜](bold fg:teal)"
error_symbol   = "[➜](bold fg:red)"
vimcmd_symbol             = "[➜](bold fg:yellow)"
vimcmd_replace_one_symbol = "[󰝿](bold fg:mauve)"
vimcmd_replace_symbol     = "[](bold fg:mauve)"
vimcmd_visual_symbol      = "[](bold fg:teal)"

[status]
disabled = false
style = "bold fg:maroon"
format = "[error](bold fg:red)[ $status]($style) "
pipestatus = true
pipestatus_format = "[$pipestatus]($style) "
pipestatus_separator = "[|]($style)"

[cmd_duration]
disabled = false
min_time = 100
show_milliseconds = false
style = "fg:peach"
format = "[take](bold fg:white)[ 󰔛 $duration ]($style)"

# Background jobs — coder hay & (build/server/watch); hiện số khi ≥1, zero-cost.
[jobs]
disabled = false
symbol = "󰜎 "
style = "bold fg:teal"
number_threshold = 1
format = "[ $symbol$number ]($style)"

[git_branch]
symbol = "[](violet950) "
style = "fg:lavender bg:violet950"
format = '[$symbol$branch(:$remote_branch)]($style)[](violet950) '

[git_state]
style = "bold fg:peach"
format = '[ \($state( $progress_current/$progress_total)\)]($style)'

[git_status]
style = "fg:overlay2"
format = "([$modified$deleted$untracked$staged$renamed$conflicted$stashed$ahead_behind]($style))"
modified   = "[!${count} ](yellow)"
deleted    = "[-${count} ](red)"
untracked  = "[?${count} ](sky)"
staged     = "[+${count} ](green)"
renamed    = "[»${count} ](blue)"
conflicted = "[✖${count} ](red bold)"
stashed    = "[≡${count} ](lavender)"

ahead      = "[⇡${count} ](teal)"
behind     = "[⇣${count} ](peach)"
diverged   = "[⇕⇡${ahead_count}⇣${behind_count} ](mauve)"

[nodejs]
symbol = ""
style = "bold fg:green"
format = "[ $symbol( $version) ]($style)"

[c]
symbol = ""
style = "bold fg:sapphire"
format = "[ $symbol( $version) ]($style)"

[rust]
symbol = ""
style = "bold fg:peach"
format = "[ $symbol( $version) ]($style)"

[golang]
symbol = ""
style = "bold fg:teal"
format = "[ $symbol( $version) ]($style)"
detect_files = ["go.mod"]

[php]
symbol = ""
style = "bold fg:mauve"
format = "[ $symbol( $version) ]($style)"

[java]
symbol = ""
style = "bold fg:red"
format = "[ $symbol( $version) ]($style)"

[kotlin]
symbol = ""
style = "bold fg:peach"
format = "[ $symbol( $version) ]($style)"

[haskell]
symbol = ""
style = "bold fg:mauve"
format = "[ $symbol( $version) ]($style)"

[python]
symbol = ""
style = "bold fg:yellow"
format = "[ $symbol( $version)( \\($virtualenv\\)) ]($style)"

[lua]
symbol = "󰢱"
style = "bold fg:blue"
format = "[ $symbol( $version) ]($style)"

[docker_context]
symbol = ""
style = "bold fg:blue"
format = "[ $symbol( $context) ]($style)"

# Redundant với các module ngôn ngữ (đọc version từ Cargo.toml/package.json) — giữ tắt.
[package]
disabled = true

# Battery: mặc định ON và tốn ~65ms/prompt (nút cổ chai duy nhất) dù pin đầy không
# hiện gì. Trùng với pin waybar (đã có cảnh báo warning/critical + màu) → tắt cho
# prompt tức thời. Muốn hiện cảnh báo pin yếu trong prompt: đổi disabled = false.
[battery]
disabled = true

