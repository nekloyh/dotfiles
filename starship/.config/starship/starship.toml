subtext1     = "#b0b5b9"

# --- accents (graphite-vivid, rebalanced) ---
rosewater = "#ff95c6"
flamingo  = "#fa8dc1"
pink      = "#e36da7"
mauve     = "#8388e8"
red       = "#ea6b62"
maroon    = "#af2c2b"
