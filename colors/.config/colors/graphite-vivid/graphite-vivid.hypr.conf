# ============================================================================
# Graphite Vivid — graphite-neutral base, vivid accents
# Canonical palette for Hyprland ecosystem.
# Sibling files: graphite-vivid.css / .sh / .toml / .nvim.lua / .alacritty.toml / .nanorc
#
# Hyprland usage examples:
#   col.active_border = $primary
#   col.inactive_border = $border
#
# Alpha helpers:
#   Every color has both $name = rgb(HEX) and $nameAlpha = HEX.
#   Use rgba($baseAlphaEE), rgba($primaryAlphaCC), etc.
# ============================================================================


