[Settings]
gtk-theme-name=Graphite-Vivid-Dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
gtk-font-name=Inter 11
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=0
gtk-menu-images=0
gtk-enable-event-sounds=0
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
# rgba=none (grayscale): panel eDP-1 là 2560x1600 trên 16" = ~188 DPI. Subpixel RGB
# không cho lợi ích nhìn thấy ở mật độ này nhưng gây viền màu, và GTK4/libadwaita
# đọc gsettings (đang là grayscale) -> trước đây GTK3 và GTK4 render chữ KHÁC nhau.
gtk-xft-rgba=none
gtk-application-prefer-dark-theme=1
