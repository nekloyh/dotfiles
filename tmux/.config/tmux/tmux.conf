# terminal/color
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# basic behavior
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

bind c new-window -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind %
bind \\ split-window -h -c "#{pane_current_path}"

bind & kill-window
bind x kill-pane

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

bind -r m resize-pane -Z

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ===== Graphite Vivid =====
# Mirrors ~/.config/colors/graphite-vivid/graphite-vivid.{css,hypr.conf,sh,toml}
# crust    #070709   mantle   #0c0d10   base     #11131a
# surface0 #1a1c22   surface1 #22252c   surface2 #2c303a   surface3 #3a3e4a
# text     #c8ccd0   subtext0 #969ca0   overlay1 #696e73
# violet   #8388e8   blue     #3aabf4   green    #99be42
# orange   #e58130   yellow   #e3b42c   cyan     #39c0b4
# red      #ea6b62   magenta  #e36da7   violet300 #a5a9ee

# status line
set -g status on
set -g status-position bottom
set -g status-interval 60
set -g status-justify left
set -g status-style "bg=#11131a,fg=#c8ccd0"

set -g status-left-length 40
set -g status-left "#[bg=#8388e8,fg=#11131a,bold]  #S #[bg=#11131a,fg=#8388e8] "

set -g window-status-format "#[fg=#696e73] #I:#W "
set -g window-status-current-format "#[bg=#22252c,fg=#8388e8,bold] #I:#W #[bg=#11131a,fg=#22252c]"

set -g status-right-length 80
set -g status-right "#[fg=#696e73]│ #[fg=#e58130]%H:%M #[fg=#696e73]│ #[fg=#a5a9ee]%a %d/%m #[fg=#696e73]│ #[fg=#3aabf4]#H "

set -g pane-border-style "fg=#22252c"
set -g pane-active-border-style "fg=#8388e8"

set -g message-style "bg=#22252c,fg=#c8ccd0"

# clock mode (prefix + t)
set -g clock-mode-colour "#8388e8"
set -g clock-mode-style 24

# copy mode highlight
set -wg mode-style "bg=#8388e8,fg=#11131a"
