# terminal/color
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# basic behavior
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

bind c new-window -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind %
bind \\ split-window -h -c "#{pane_current_path}"

bind & kill-window
bind x kill-pane

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

bind -r m resize-pane -Z

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ===== Catppuccin Mocha (black-tinted) =====
# base    #0a0a0a   surface0 #11111b   surface1 #181825   surface2 #1e1e2e
# text    #cdd6f4   subtext0 #a6adc8   overlay0 #6c7086
# mauve   #cba6f7   blue     #89b4fa   green    #a6e3a1
# peach   #fab387   yellow   #f9e2af   teal     #94e2d5
# red     #f38ba8   lavender #b4befe

# status line
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#0a0a0a,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[bg=#cba6f7,fg=#0a0a0a,bold]  #S #[bg=#0a0a0a,fg=#cba6f7] "

set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[bg=#181825,fg=#a6e3a1,bold] #I:#W #[bg=#0a0a0a,fg=#181825]"

set -g status-right-length 80
set -g status-right "#[fg=#6c7086]│ #[fg=#fab387]%H:%M #[fg=#6c7086]│ #[fg=#b4befe]%a %d/%m #[fg=#6c7086]│ #[fg=#89b4fa]#H "

set -g pane-border-style "fg=#181825"
set -g pane-active-border-style "fg=#cba6f7"

set -g message-style "bg=#181825,fg=#cdd6f4"
set -g mode-style "bg=#cba6f7,fg=#0a0a0a,bold"

# clock mode (prefix + t)
set -g clock-mode-colour "#cba6f7"
set -g clock-mode-style 24

# copy mode highlight
set -wg mode-style "bg=#cba6f7,fg=#0a0a0a"
