## Decoration - minimal Graphite Vivid ##
# https://wiki.hypr.land/Configuring/Variables/

# Border palette
# rgb()  takes 6 hex (RRGGBB), for opaque gradient stops
# rgba() takes 8 hex (RRGGBBAA), for alpha
$activeBorderColor   = rgb($primaryAlpha) rgb($blueAlpha) 45deg
$inactiveBorderColor = rgba($overlay1Alpha55)
$groupActiveColor    = rgb($orangeAlpha) rgb($yellowAlpha) 45deg
$groupInactiveColor  = rgba($overlay1Alpha55)

general {
    gaps_in = 4
    # top right bottom left — top nhỏ hơn để window ôm sát waybar
    # (1 window đã có smart-gaps = 0; đây là gap khi ≥2 window)
    gaps_out = 4 10 10 10

    border_size = 2

    col.active_border   = $activeBorderColor
    col.inactive_border = $inactiveBorderColor

    resize_on_border = true
    allow_tearing = false

    layout = dwindle

    snap {
        enabled = true
    }
}

group {
    col.border_active   = $groupActiveColor
    col.border_inactive = $groupInactiveColor
    col.border_locked_active   = $activeBorderColor
    col.border_locked_inactive = $inactiveBorderColor

    groupbar {
        enabled = true
        height = 4
        gradients = true
        text_color = $text
        col.active = $orange
        col.inactive = $overlay0
    }
}

decoration {
    rounding = 12
    rounding_power = 2.5

    active_opacity   = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    # Chỉ dùng dim_inactive (overlay đen nhẹ) làm chỉ báo focus,
    # không double-dim bằng opacity nữa.
    dim_inactive = true
    dim_strength = 0.10
    dim_special = 0.30

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000066)
        color_inactive = rgba(00000033)
        offset = 0 2
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 1.05
        brightness = 0.95
        vibrancy = 0.15
    }
}

# Layer blur: dùng layerrule trong windowrules.conf (blurls là cơ chế cũ, đã bỏ).
# hyprlock tự blur background trong hyprlock.conf — không cần rule ở compositor.
