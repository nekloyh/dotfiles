## Animations — "alive but instant" ##
# https://wiki.hypr.land/Configuring/Variables/#animations
# Đơn vị tốc độ = decisecond (1 = 100ms).
#
# Triết lý: mọi chuyển động THƯỜNG DÙNG kết thúc ≤ ~280ms (không chắn thao tác),
# nhưng dùng curve giảm tốc mạnh (easeOutExpo) — 80% quãng đường xảy ra trong 1/3
# thời gian đầu nên CẢM GIÁC gần như tức thì, phần đuôi chỉ là "hãm êm".
# Cửa sổ mới có overshoot ~4% (softBack) — sống động mà không lố.
# Đóng cửa sổ dùng ease-in nhanh: thứ biến mất phải biến mất ngay.

animations {
    enabled = true

    # == Curves ==
    bezier = easeOutExpo, 0.16, 1.00, 0.30, 1.00   # giảm tốc mạnh — "bắn tới nơi rồi hãm êm"
    bezier = softBack,    0.34, 1.27, 0.64, 1.00   # overshoot ~4% — cửa sổ mới "nảy" nhẹ
    bezier = easeInQuad,  0.55, 0.09, 0.68, 0.53   # tăng tốc — cho thứ đang rời đi
    bezier = linear,      0.00, 0.00, 1.00, 1.00

    # Default fallback
    animation = global, 1, 2.4, easeOutExpo

    # == Windows ==
    animation = windowsIn,   1, 2.8, softBack, popin 85%
    animation = windowsOut,  1, 1.6, easeInQuad, popin 88%
    animation = windowsMove, 1, 2.4, easeOutExpo

    # == Fade ==
    animation = fade,    1, 1.8, easeOutExpo
    animation = fadeOut, 1, 1.4, easeInQuad
    animation = fadeDim, 1, 2.6, easeOutExpo    # dim_inactive chuyển mượt khi đổi focus

    # == Layers (waybar, swaync, popups) ==
    # waybar/swaync có layerrule "animation slide top" riêng — hướng trượt khớp vị trí bar.
    animation = layersIn,  1, 2.2, easeOutExpo, popin 92%
    animation = layersOut, 1, 1.4, easeInQuad, fade

    # == Workspaces — slide định hướng (thấy được mình đi trái/phải) ==
    animation = workspaces, 1, 2.6, easeOutExpo, slide

    # == Special workspace (scratchpad) — thả xuống từ trên như dropdown ==
    animation = specialWorkspace, 1, 2.4, easeOutExpo, slidefadevert 20%

    # == Border ==
    animation = border, 1, 4, easeOutExpo
    # borderangle KHÔNG loop: loop = re-render liên tục → tốn GPU/pin.
    # Không loop thì gradient chỉ xoay 1 vòng lúc reload — đủ làm "chào sân".
    animation = borderangle, 1, 30, linear
}
