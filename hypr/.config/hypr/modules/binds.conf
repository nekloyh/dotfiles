## Keybinds ##
# https://wiki.hypr.land/Configuring/Keywords/

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
    movefocus_cycles_fullscreen = false
}

$mainMod = SUPER

############
### APPS ###
############
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, B,      exec, $browser
bind = $mainMod, C,      exec, code
bind = $mainMod SHIFT, N, exec, swaync-client -t

# Walker launcher (replaces rofi drun on SUPER+D)
bind = $mainMod, SPACE, exec, pkill walker || walker
bind = $mainMod, D,     exec, pkill walker || walker

# Walker — clipboard history
bind = $mainMod SHIFT, V, exec, walker -m clipboard
# Walker — emoji/symbols (moved off "." which now switches monitor focus)
bind = $mainMod SHIFT, period, exec, walker -m symbols

# Lock & power
# SUPER+L bị chiếm bởi vim-style movefocus (line 58) — dùng SUPER+ESCAPE thay thế.
bind = $mainMod, ESCAPE, exec, hyprlock
bind = $mainMod SHIFT, M, exec, wlogout

# Toggle blur intensity (chuyển từ middle-click battery trên waybar về bind riêng)
bind = $mainMod ALT, B, exec, ~/.config/hypr/scripts/changeBlur.sh

##########################
### WINDOW MANAGEMENT  ###
##########################
bind = $mainMod,        W, killactive
bind = $mainMod,        F, fullscreen, 0
bind = $mainMod SHIFT,  F, fullscreen, 1
bind = $mainMod,        V, togglefloating
bind = $mainMod,        P, pseudo
bind = $mainMod SHIFT,  T, layoutmsg, togglesplit
bind = $mainMod SHIFT,  P, pin
bind = $mainMod,        G, togglegroup
bind = $mainMod,        Tab, changegroupactive, f
bind = $mainMod SHIFT,  Tab, changegroupactive, b
bind = $mainMod SHIFT,  C, centerwindow

# Focus (vim-style)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move active window within workspace.
# movewindoworgroup = như movewindow, NHƯNG nếu đích là một group thì
# nhập window vào group đó — group dùng được hoàn toàn bằng bàn phím.
bind = $mainMod SHIFT, h, movewindoworgroup, l
bind = $mainMod SHIFT, l, movewindoworgroup, r
bind = $mainMod SHIFT, k, movewindoworgroup, u
bind = $mainMod SHIFT, j, movewindoworgroup, d

# Rút window đang active ra khỏi group
bind = $mainMod ALT, G, moveoutofgroup

# Move active window to next/prev monitor
bind = $mainMod ALT, h, movewindow, mon:l
bind = $mainMod ALT, l, movewindow, mon:r
bind = $mainMod ALT, k, movewindow, mon:u
bind = $mainMod ALT, j, movewindow, mon:d

# Switch monitor focus
bind = $mainMod, comma,  focusmonitor, -1
bind = $mainMod, period, focusmonitor, +1

# Cycle window focus (Alt+Tab style) — kèm alterzorder để window float
# được kéo lên trên cùng thay vì focus mà vẫn bị che
bind = ALT, Tab, cyclenext
bind = ALT, Tab, alterzorder, top
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, alterzorder, top

###############
### RESIZE  ###
###############
# Quick resize (held)
binde = $mainMod CTRL, h, resizeactive, -50 0
binde = $mainMod CTRL, l, resizeactive,  50 0
binde = $mainMod CTRL, k, resizeactive,  0 -50
binde = $mainMod CTRL, j, resizeactive,  0  50

# Resize submap — Super+R to enter, hjkl to resize, Esc/Enter to exit
bind = $mainMod, R, submap, resize
submap = resize
binde = , h, resizeactive, -30 0
binde = , l, resizeactive,  30 0
binde = , k, resizeactive,  0 -30
binde = , j, resizeactive,  0  30
binde = SHIFT, h, resizeactive, -100 0
binde = SHIFT, l, resizeactive,  100 0
binde = SHIFT, k, resizeactive,  0 -100
binde = SHIFT, j, resizeactive,  0  100
bind  = , escape, submap, reset
bind  = , return, submap, reset
submap = reset

##################
### WORKSPACES ###
##################
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, grave, workspace, previous

# Move window to workspace (follow)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move window silently (no follow)
bind = $mainMod CTRL SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL SHIFT, 0, movetoworkspacesilent, 10

# Workspace scroll on monitor (mouse wheel)
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Scratchpad — tự spawn terminal lần đầu, sau đó toggle (xem scripts/scratchpad.sh)
bind = $mainMod,       S, exec, ~/.config/hypr/scripts/scratchpad.sh
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Mouse drag
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

##################
### SCREENSHOT ###
##################
# Screenshot — wrapper riêng (~/.config/hypr/scripts/screenshot.sh) thay hyprshot.
# Lý do: hyprshot's -z freeze vẫn để slurp selection rectangle leak thành "viền đen" trong
# ảnh. Wrapper dùng slurp với colors trong suốt + hyprpicker freeze → capture sạch hoàn toàn.
# Modifier nâng dần: bare=clipboard-only, SHIFT=save, SUPER=window, SUPER+SHIFT=output.
$screenshot = ~/.config/hypr/scripts/screenshot.sh
bind = ,                Print, exec, $screenshot region-clip
bind = SHIFT,           Print, exec, $screenshot region
bind = $mainMod,        Print, exec, $screenshot window
bind = $mainMod SHIFT,  Print, exec, $screenshot output

####################
### SCREEN RECORD ##
####################
# Quay màn hình — wf-recorder + VAAPI (Intel iGPU) + mic & âm thanh hệ thống.
# Cùng một keybind là toggle: bấm lần đầu để bắt đầu, bấm lại để dừng & lưu mp4 vào
# ~/Videos/Recordings. ALT+Print = chọn vùng, ALT+SHIFT+Print = nguyên màn hình focus.
$screenrecord = ~/.config/hypr/scripts/screenrecord.sh
bind = ALT,       Print, exec, $screenrecord region
bind = ALT SHIFT, Print, exec, $screenrecord full

#############
### MEDIA ###
#############
# Volume/brightness đi qua script chung với waybar → cùng step, cùng limit,
# cùng notification, dù bấm phím hay scroll trên bar.
$volume = ~/.config/hypr/scripts/volume.sh
$brightness = ~/.config/hypr/scripts/brightness.sh

bindel = , XF86AudioRaiseVolume, exec, $volume --inc
bindel = , XF86AudioLowerVolume, exec, $volume --dec
bindl = , XF86AudioMute,         exec, $volume --toggle
bindl = , XF86AudioMicMute,      exec, $volume --toggle-mic

bindel = , XF86MonBrightnessUp,   exec, $brightness --inc
bindel = , XF86MonBrightnessDown, exec, $brightness --dec

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
