## hyprlock - Graphite Vivid ##

source = ~/.config/colors/graphite-vivid/graphite-vivid.hypr.conf

# Semantic tokens
# alpha cc = 0.80 KHÔNG có trên thang 7 bậc (.15 .22 .30 .45 .55 .70 .92) —
# đây là ngoại lệ CỐ Ý ĐỂ NGUYÊN, không phải sót. Lý do: hyprlock kết nối
# Wayland TRƯỚC khi parse config nên không có cách nào validate thay đổi mà
# không khoá thật màn hình. Đổi mù một giá trị trên màn khoá để lấy một nit về
# thang alpha là trao đổi tồi.
# Muốn sửa thì tự verify: đổi cc -> b3 (0.70) rồi `loginctl lock-session`,
# xem ô nhập còn đọc được không, mở khoá, rồi mới commit.
$inner_color  = rgba($baseAlphacc)
$outer_color  = $primary
$font_color   = $text
$dim_color    = $subtext0
$check_color  = $green
$fail_color   = $red

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    path=~/Pictures/Wallpapers/pool.png
    blur_passes = 2
    blur_size = 6
    contrast = 0.9
    brightness = 0.7
    # vibrancy = 0
    # vibrancy_darkness = 0
}

# Clock
label {
    monitor =
    text = $TIME
    color = $font_color
    font_family = JetBrainsMono Nerd Font ExtraBold
    font_size = 140
    position = 0, 80
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = $dim_color
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    position = 0, -40
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = cmd[update:0] whoami
    color = $outer_color
    font_family = JetBrainsMono Nerd Font Medium
    font_size = 14
    position = 0, -60
    halign = center
    valign = top
}

# Password
input-field {
    monitor =
    size = 320, 44
    outline_thickness = 3
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    rounding = 12
    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $font_color
    check_color = $check_color
    fail_color = $fail_color
    fade_on_empty = true
    placeholder_text = <i>Enter password...</i>
    hide_input = false
    position = 0, 80
    halign = center
    valign = bottom
}
