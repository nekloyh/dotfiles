## hypridle — dim → tắt màn → khoá.
##
## Suspend bị mask có chủ đích (project_suspend_broken) nên KHÔNG có sleep_cmd
## và KHÔNG có listener nào gọi systemctl suspend.

general {
    # Manual lock (loginctl lock-session / wlogout) vẫn gọi hyprlock.
    lock_cmd = pidof hyprlock >/dev/null || hyprlock --immediate-render --no-fade-in --grace 0
}

# 30 phút idle → giảm sáng còn 10% (cảnh báo mềm trước khi tắt hẳn).
listener {
    timeout = 1800
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 35 phút idle → TẮT MÀN (DPMS off). Panel 16" 165Hz là hộ tiêu thụ lớn nhất
# khi máy rảnh — tắt panel không đụng gì tới process nền: build, training,
# download, container vẫn chạy y nguyên, vì DPMS chỉ đổi power state của màn
# hình chứ không phải của hệ thống.
#
# ⚠ PHẢI gọi qua scripts/dpms.sh, KHÔNG gọi thẳng hyprctl:
#   - `hyprctl dispatch dpms off` kiểu legacy FAIL (exit 7) dưới provider lua.
#   - `hl.dsp.dpms("off")` bỏ qua tham số — nó là TOGGLE thuần (đo 2026-09-01),
#     nên gọi thẳng sẽ ĐẢO NGƯỢC ngay khi lỡ một sự kiện: lần idle kế tiếp sẽ
#     BẬT màn thay vì tắt. dpms.sh đọc dpmsStatus trước rồi mới toggle.
#
# Đánh thức: gõ phím hoặc rê chuột (misc.key_press_enables_dpms +
# misc.mouse_move_enables_dpms = true trong modules/misc.lua). Trước 2026-09-01
# cả hai đều false = mặc định Hyprland → màn tắt xong không cách nào bật lại,
# trông hệt như máy treo. Đó mới là "lỗi tắt màn rồi mở lại", không phải driver:
# đo 5/5 chu kỳ dpms off→on đều modeset lại eDP-1 2560x1600@165 sạch, kernel
# log không một lỗi drm/i915/nvidia nào.
listener {
    timeout = 2100
    on-timeout = ~/.config/hypr/scripts/dpms.sh off
    on-resume  = ~/.config/hypr/scripts/dpms.sh on
}

# 5 giờ idle → auto-lock visual.
# hyprlock chỉ chặn input + hiện UI nhập password — process nền chạy bình thường.
listener {
    timeout = 18000
    on-timeout = pidof hyprlock >/dev/null || hyprlock --immediate-render --no-fade-in --grace 0
}
