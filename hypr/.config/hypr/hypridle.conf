## hypridle — dim brightness + visual lock.
## hyprlock chỉ chặn input + hiện lock UI: KHÔNG dừng process đang chạy,
## KHÔNG suspend, KHÔNG DPMS off màn hình.
## Suspend bị mask (project_suspend_broken) nên sleep_cmd dead → đã bỏ.

general {
    # Manual lock (loginctl lock-session / wlogout) vẫn gọi hyprlock.
    lock_cmd = pidof hyprlock >/dev/null || hyprlock --immediate-render --no-fade-in --grace 0
}

# 30 min idle → dim brightness (KHÔNG tắt màn hình, KHÔNG lock).
listener {
    timeout = 1800
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 giờ idle → auto-lock visual.
# hyprlock chỉ chặn input + hiện UI nhập password — process nền (build, training, download...)
# tiếp tục chạy bình thường. Màn hình KHÔNG tắt (không có `dpms off` ở đây).
listener {
    timeout = 18000
    on-timeout = pidof hyprlock >/dev/null || hyprlock --immediate-render --no-fade-in --grace 0
}
